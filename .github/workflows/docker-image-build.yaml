name: Build Docker Image Variants

on:
  workflow_call:
    inputs:
      push-to-registries:
        description: Push built images to GHCR and Docker Hub
        type: boolean
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  prepare-build:
    name: Prepare image build inputs
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.generate-build-matrix.outputs.matrix }}
      mitmproxy-version: ${{ steps.resolve-mitmproxy-version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve the latest mitmproxy release
        id: resolve-mitmproxy-version
        uses: ./.github/actions/resolve-mitmproxy-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the distribution and platform matrix
        id: generate-build-matrix
        run: |
          matrix=$(jq -ces '
            def require_image_tag($field):
              if type == "string" and test("\\A[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}\\z") then .
              else error($field + " must be a valid Docker image tag")
              end;

            def require_build_platforms($field):
              if type == "string" and (split(",") | length > 0 and all(test("[^[:space:]]"))) then .
              else error($field + " must be a comma-separated string with no empty platforms")
              end;

            if length == 1 and (.[0] | type == "object") then .[0]
            else error("build-params.json must contain exactly one JSON object")
            end |

            (.alpine.baseImageTag | require_image_tag("alpine.baseImageTag")) as $alpineBaseImageTag |
            (.debian.baseImageTag | require_image_tag("debian.baseImageTag")) as $debianBaseImageTag |
            (.ubuntu.baseImageTag | require_image_tag("ubuntu.baseImageTag")) as $ubuntuBaseImageTag |
            ($debianBaseImageTag + "-slim" | require_image_tag("Debian slim base image tag")) as $debianSlimBaseImageTag |
            (.debian.buildPlatforms | require_build_platforms("debian.buildPlatforms")) as $debianBuildPlatforms |

            {include: [
              {
                "distribution": "alpine",
                "base-image-tag": $alpineBaseImageTag,
                "versioned-distro-tag": "alpine\($alpineBaseImageTag)",
                "build-platforms": (.alpine.buildPlatforms | require_build_platforms("alpine.buildPlatforms"))
              },
              {
                "distribution": "debian",
                "base-image-tag": $debianBaseImageTag,
                "versioned-distro-tag": $debianBaseImageTag,
                "build-platforms": $debianBuildPlatforms
              },
              {
                "distribution": "debian-slim",
                "base-image-tag": $debianSlimBaseImageTag,
                "versioned-distro-tag": $debianSlimBaseImageTag,
                "build-platforms": $debianBuildPlatforms
              },
              {
                "distribution": "ubuntu",
                "base-image-tag": $ubuntuBaseImageTag,
                "versioned-distro-tag": $ubuntuBaseImageTag,
                "build-platforms": (.ubuntu.buildPlatforms | require_build_platforms("ubuntu.buildPlatforms"))
              }
            ]}
          ' .github/build-params.json)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build-image-variants:
    name: Build ${{ matrix['versioned-distro-tag'] }} images
    runs-on: ubuntu-latest
    needs: prepare-build
    strategy:
      matrix: ${{ fromJSON(needs.prepare-build.outputs.build-matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU and Docker Buildx
        uses: ./.github/actions/setup-multiplatform-buildx
        with:
          platforms: all

      - name: Log in to GHCR and Docker Hub
        if: inputs.push-to-registries
        uses: ./.github/actions/login-image-registries
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Collect image build metadata
        id: image-metadata
        uses: ./.github/actions/collect-image-build-metadata

      - name: Generate registry tags for each image target
        if: inputs.push-to-registries
        id: registry-tags
        uses: ./.github/actions/generate-image-tags
        with:
          versioned-distro-tag: ${{ matrix['versioned-distro-tag'] }}
          distro-tag: ${{ matrix.distribution }}
          targets: basic,standard,advanced
          sha-short: ${{ steps.image-metadata.outputs['sha-short'] }}
          owner-lowercase: ${{ steps.image-metadata.outputs['owner-lowercase'] }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Run Docker Bake for all image targets
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: default
          push: ${{ inputs.push-to-registries }}
          set: ${{ !inputs.push-to-registries && '*.output=type=cacheonly' || '' }}
        env:
          DISTRO: ${{ matrix.distribution }}
          DISTRO_VERSION: ${{ matrix['versioned-distro-tag'] }}
          BASE_IMAGE_TAG: ${{ matrix['base-image-tag'] }}
          PLATFORMS: ${{ matrix['build-platforms'] }}
          MAINTAINER: ${{ steps.image-metadata.outputs['owner'] }}
          BUILD_DATE: ${{ steps.image-metadata.outputs.date }}
          BUILD_EPOCH: ${{ github.run_id }}-${{ github.run_attempt }}
          GIT_COMMIT: ${{ steps.image-metadata.outputs['sha-full'] }}
          MITMPROXY_VERSION: ${{ needs.prepare-build.outputs.mitmproxy-version }}
          TAGS_BASIC: ${{ steps.registry-tags.outputs.tags-basic || 'network-helper:basic' }}
          TAGS_STANDARD: ${{ steps.registry-tags.outputs.tags-standard || 'network-helper:standard' }}
          TAGS_ADVANCED: ${{ steps.registry-tags.outputs.tags-advanced || 'network-helper:advanced' }}
