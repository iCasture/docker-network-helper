name: 'Set up multi-platform Docker Buildx'
description: 'Register QEMU emulators and create a Buildx builder using the docker-container driver'

inputs:
  platforms:
    description: 'Comma-separated QEMU platform names, or all'
    required: false
    default: 'all'

runs:
  using: 'composite'
  steps:
    # Register emulators before creating the builder so Buildx can detect them.
    - name: Register QEMU emulators
      uses: docker/setup-qemu-action@v4
      with:
        platforms: ${{ inputs.platforms }}

    - name: Create a Docker container builder
      uses: docker/setup-buildx-action@v4
      with:
        driver: docker-container   # Enable multi-platform builds

    - name: List registered QEMU binfmt handlers
      shell: bash
      run: ls /proc/sys/fs/binfmt_misc | grep qemu

    - name: Report the Buildx driver and available builders
      shell: bash
      run: |
        echo "Current buildx driver:"
        docker buildx inspect --bootstrap | grep -E "(Driver|Status)" || true
        echo "Available builders:"
        docker buildx ls
